[project]
name = "loanlens-backend"
version = "0.1.0"
description = "LoanLens API and AI pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "python-multipart>=0.0.17",
    "pdfplumber>=0.11",
    "anthropic>=1.0",
    "rapidfuzz>=3.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "reportlab>=4.2",
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
