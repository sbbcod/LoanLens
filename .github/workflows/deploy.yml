# Test, build and release LoanLens on every push to main.
#
# API:      run the tests -> build the Docker image -> push it to GitHub Container
#           Registry -> point the Azure Container App at the new image.
# Web app:  type-check and build the React app -> upload it to Azure Static Web Apps.
#
# Azure sign-in uses OpenID Connect: GitHub proves to Azure which repository and
# branch is asking, so no Azure password or key is stored in GitHub. The deploy
# jobs only run once infra/deploy.sh has created the resources and the repository
# variables below have been set.

name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-loanlens-demo
  CONTAINER_APP: loanlens-api
  STATIC_WEB_APP: loanlens-web

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - run: pytest -q

  build-image:
    needs: test-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        # Registry paths must be lower case.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loanlens-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    needs: build-image
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Each release is pinned to the commit's image, so it is clear what is running
      # and a rollback is just pointing back at an older tag.
      - run: >
          az containerapp update
          --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP"
          --image "${{ needs.build-image.outputs.image }}:${{ github.sha }}"
          --output none

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: frontend/dist

  deploy-web:
    needs: build-web
    if: vars.AZURE_CLIENT_ID != '' && vars.API_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Static Web Apps uploads need a deployment token. Fetch it at deploy time
      # instead of storing it as a GitHub secret, and mask it in the log.
      - id: token
        run: |
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP" \
            --resource-group "$RESOURCE_GROUP" --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
